name: Sync pnpm-lock.yaml on Dependabot PRs

# Dependabot sometimes opens single-package PRs without updating the
# corresponding pnpm-lock.yaml — especially in this repo's per-package
# lockfile setup (.npmrc: shared-workspace-lockfile=false → 5 separate
# lockfiles). This workflow re-runs `pnpm install` on every Dependabot PR
# that touches a package.json and pushes any lockfile changes back to the
# PR branch.

on:
  pull_request:
    paths:
      - '**/package.json'

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      # --ignore-scripts skips package install scripts. We do this because
      # this workflow runs on PR-author-controlled code (the bumped dep
      # itself), and we don't want to execute arbitrary install scripts
      # from a freshly-bumped dependency on CI.
      - name: Resync lockfiles
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Commit and push lockfile changes
        run: |
          if [[ -z $(git status --porcelain) ]]; then
            echo "No lockfile changes needed."
            exit 0
          fi
          git config user.name 'dependabot[bot]'
          git config user.email '49699333+dependabot[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore: sync pnpm-lock.yaml"
          git push
